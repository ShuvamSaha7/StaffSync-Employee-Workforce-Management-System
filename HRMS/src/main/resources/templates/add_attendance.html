<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Add Attendance
                    </h4>

                </div>

                <div class="card-body">

                    <form th:action="@{/attendance/save}"
                          th:object="${attendance}"
                          method="post">


                        <!-- Employee -->

                        <div class="mb-3">

                            <label class="form-label">
                                Employee
                            </label>

                            <select th:field="*{employee}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Employee
                                </option>

                                <option th:each="employee : ${employees}"
                                        th:value="${employee.id}"
                                        th:text="${employee.name}">
                                </option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('employee')}"
                                 th:errors="*{employee}">
                            </div>

                        </div>


                        <!-- Date -->

                        <div class="mb-3">

                            <label class="form-label">
                                Attendance Date
                            </label>

                            <input type="date"
                                   th:field="*{attendanceDate}"
                                   class="form-control"
                                   required>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('attendanceDate')}"
                                 th:errors="*{attendanceDate}">
                            </div>

                        </div>


                        <!-- Time -->

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Check In
                                </label>

                                <input type="time"
                                       th:field="*{checkIn}"
                                       class="form-control">

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Check Out
                                </label>

                                <input type="time"
                                       th:field="*{checkOut}"
                                       class="form-control">

                            </div>

                        </div>


                        <!-- Status -->

                        <div class="mb-3">

                            <label class="form-label">
                                Status
                            </label>

                            <select th:field="*{status}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Status
                                </option>

                                <option value="PRESENT">
                                    Present
                                </option>

                                <option value="ABSENT">
                                    Absent
                                </option>

                                <option value="HALF DAY">
                                    Half Day
                                </option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('status')}"
                                 th:errors="*{status}">
                            </div>

                        </div>


                        <!-- Remarks -->

                        <div class="mb-3">

                            <label class="form-label">
                                Remarks
                            </label>

                            <textarea th:field="*{remarks}"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Optional remarks">
                            </textarea>

                        </div>


                        <!-- Buttons -->

                        <button type="submit"
                                class="btn btn-success">

                            Save Attendance

                        </button>

                        <a href="/attendance"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
