<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Payroll - StaffSync</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f5f7fb;
        }

        .payroll-card {
            max-width: 750px;
            margin: 40px auto;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .card-header {
            border-radius: 16px 16px 0 0 !important;
        }

        .form-label {
            font-weight: 600;
        }

        .salary-preview {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card payroll-card">

        <!-- Header -->

        <div class="card-header bg-primary text-white p-4">

            <h3 class="mb-1">
                Add Payroll
            </h3>

            <small>
                Create a payroll record for an employee
            </small>

        </div>


        <div class="card-body p-4">

            <form th:action="@{/payroll/save}"
                  th:object="${payroll}"
                  method="post">


                <!-- Employee -->

                <div class="mb-4">

                    <label class="form-label">
                        Employee
                    </label>

                    <select th:field="*{employee}"
                            id="employee"
                            class="form-select"
                            required>

                        <option value="">
                            Select Employee
                        </option>

                        <option th:each="employee : ${employees}"
                                th:value="${employee.id}"
                                th:text="${employee.name + ' - ₹' + employee.salary}">
                        </option>

                    </select>

                    <div class="text-danger mt-1"
                         th:if="${#fields.hasErrors('employee')}"
                         th:errors="*{employee}">
                    </div>

                </div>


                <!-- Payroll Month -->

                <div class="mb-4">

                    <label class="form-label">
                        Payroll Month
                    </label>

                    <input type="month"
                           th:field="*{payrollMonth}"
                           class="form-control"
                           required>

                    <div class="text-danger mt-1"
                         th:if="${#fields.hasErrors('payrollMonth')}"
                         th:errors="*{payrollMonth}">
                    </div>

                </div>


                <!-- Basic Salary -->

                <div class="mb-4">

                    <label class="form-label">
                        Basic Salary
                    </label>

                    <input type="number"
                           th:field="*{basicSalary}"
                           id="basicSalary"
                           class="form-control"
                           step="0.01"
                           min="0"
                           readonly>

                    <small class="text-muted">
                        Basic salary is taken from the employee record.
                    </small>

                </div>


                <!-- Allowance -->

                <div class="mb-4">

                    <label class="form-label">
                        Allowance
                    </label>

                    <input type="number"
                           th:field="*{allowance}"
                           id="allowance"
                           class="form-control"
                           step="0.01"
                           min="0"
                           value="0"
                           required>

                </div>


                <!-- Deduction -->

                <div class="mb-4">

                    <label class="form-label">
                        Deduction
                    </label>

                    <input type="number"
                           th:field="*{deduction}"
                           id="deduction"
                           class="form-control"
                           step="0.01"
                           min="0"
                           value="0"
                           required>

                </div>


                <!-- Net Salary Preview -->

                <div class="salary-preview mb-4">

                    <div class="d-flex justify-content-between">

                        <span>
                            Net Salary
                        </span>

                        <strong class="text-success"
                                id="netSalaryPreview">

                            ₹0.00

                        </strong>

                    </div>

                    <small class="text-muted">

                        Basic Salary + Allowance − Deduction

                    </small>

                </div>


                <!-- Payment Date -->

                <div class="mb-4">

                    <label class="form-label">
                        Payment Date
                    </label>

                    <input type="date"
                           th:field="*{paymentDate}"
                           class="form-control">

                </div>


                <!-- Status -->

                <div class="mb-4">

                    <label class="form-label">
                        Payroll Status
                    </label>

                    <select th:field="*{status}"
                            class="form-select"
                            required>

                        <option value="">
                            Select Status
                        </option>

                        <option value="PENDING">
                            Pending
                        </option>

                        <option value="PAID">
                            Paid
                        </option>

                        <option value="CANCELLED">
                            Cancelled
                        </option>

                    </select>

                    <div class="text-danger mt-1"
                         th:if="${#fields.hasErrors('status')}"
                         th:errors="*{status}">
                    </div>

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success">

                        Save Payroll

                    </button>

                    <a href="/payroll"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- Net Salary Preview -->

<script>

    const employeeSelect =
        document.getElementById("employee");

    const basicSalary =
        document.getElementById("basicSalary");

    const allowance =
        document.getElementById("allowance");

    const deduction =
        document.getElementById("deduction");

    const netSalaryPreview =
        document.getElementById("netSalaryPreview");


    function calculateNetSalary() {

        const basic =
            parseFloat(basicSalary.value) || 0;

        const allow =
            parseFloat(allowance.value) || 0;

        const deduct =
            parseFloat(deduction.value) || 0;

        const net =
            basic + allow - deduct;

        netSalaryPreview.textContent =
            "₹" + net.toFixed(2);
    }


    employeeSelect.addEventListener(
        "change",
        function () {

            const selectedOption =
                employeeSelect.options[
                    employeeSelect.selectedIndex
                    ];

            const text =
                selectedOption.text;

            const salaryMatch =
                text.match(/₹([\d.]+)/);

            if (salaryMatch) {

                basicSalary.value =
                    salaryMatch[1];

            } else {

                basicSalary.value = "";

            }

            calculateNetSalary();

        }
    );


    allowance.addEventListener(
        "input",
        calculateNetSalary
    );


    deduction.addEventListener(
        "input",
        calculateNetSalary
    );

</script>

</body>

</html>
