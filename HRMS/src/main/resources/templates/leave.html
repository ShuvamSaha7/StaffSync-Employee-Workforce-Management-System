<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Leave Management - StaffSync</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .page-header {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .table-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .table {
            vertical-align: middle;
        }

        .table thead th {
            white-space: nowrap;
        }

        .status-badge {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .approved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .rejected {
            background: #f8d7da;
            color: #842029;
        }

        .action-btn {
            border-radius: 8px;
            margin-right: 4px;
        }

    </style>

</head>


<body>


<div class="container-fluid px-4 py-4">


    <!-- ================= HEADER ================= -->

    <div class="page-header mb-4">

        <div class="d-flex justify-content-between
                    align-items-center flex-wrap gap-3">

            <div>

                <h2 class="fw-bold mb-1">
                    Leave Management
                </h2>

                <p class="text-muted mb-0">
                    Manage employee leave requests and approvals.
                </p>

            </div>


            <a href="/leaves/add"
               class="btn btn-primary">

                + Add Leave

            </a>

        </div>

    </div>


    <!-- ================= TABLE ================= -->

    <div class="table-card">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Employee</th>

                    <th>Leave Type</th>

                    <th>Start Date</th>

                    <th>End Date</th>

                    <th>Reason</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="leave : ${leaves}">


                    <!-- ID -->

                    <td th:text="${leave.id}">
                        1
                    </td>


                    <!-- Employee -->

                    <td>

                        <strong
                                th:text="${leave.employee != null
                                ? leave.employee.name
                                : 'Not Assigned'}">

                            Employee

                        </strong>

                    </td>


                    <!-- Leave Type -->

                    <td th:text="${leave.leaveType}">
                        Casual
                    </td>


                    <!-- Start Date -->

                    <td th:text="${leave.startDate}">
                        2026-08-01
                    </td>


                    <!-- End Date -->

                    <td th:text="${leave.endDate}">
                        2026-08-03
                    </td>


                    <!-- Reason -->

                    <td>

                        <span th:text="${leave.reason}">
                            Personal work
                        </span>

                    </td>


                    <!-- Status -->

                    <td>

                        <span class="status-badge pending"
                              th:if="${leave.status == 'Pending'}">

                            Pending

                        </span>


                        <span class="status-badge approved"
                              th:if="${leave.status == 'Approved'}">

                            Approved

                        </span>


                        <span class="status-badge rejected"
                              th:if="${leave.status == 'Rejected'}">

                            Rejected

                        </span>


                        <span class="status-badge"
                              th:if="${leave.status != 'Pending'
                                  and leave.status != 'Approved'
                                  and leave.status != 'Rejected'}"
                              th:text="${leave.status}">

                            Status

                        </span>

                    </td>


                    <!-- Actions -->

                    <td>

                        <a th:href="@{/leaves/edit/{id}(id=${leave.id})}"
                           class="btn btn-warning btn-sm action-btn">

                            Edit

                        </a>


                        <a th:href="@{/leaves/delete/{id}(id=${leave.id})}"
                           class="btn btn-danger btn-sm action-btn"
                           onclick="return confirm('Are you sure you want to delete this leave record?')">

                            Delete

                        </a>

                    </td>


                </tr>


                <!-- Empty State -->

                <tr th:if="${#lists.isEmpty(leaves)}">

                    <td colspan="8"
                        class="text-center text-muted py-4">

                        No leave records found.

                    </td>

                </tr>


                </tbody>

            </table>

        </div>


        <!-- Back -->

        <div class="mt-3">

            <a href="/dashboard"
               class="btn btn-secondary">

                Back to Dashboard

            </a>

        </div>

    </div>


</div>


</body>

</html>
