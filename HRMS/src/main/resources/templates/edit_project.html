<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

    <title>Edit Project</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">


</head>


<body>


<div class="container mt-5">


    <div class="card shadow">


        <div class="card-header bg-warning">

            <h3 class="mb-0">
                Edit Project
            </h3>

        </div>



        <div class="card-body">


            <form th:action="@{/projects/update/{id}(id=${project.id})}"
                  th:object="${project}"
                  method="post">





                <div class="mb-3">

                    <label class="form-label">
                        Project Name
                    </label>


                    <input type="text"
                           class="form-control"
                           th:field="*{projectName}">


                </div>






                <div class="mb-3">


                    <label class="form-label">
                        Description
                    </label>


                    <textarea class="form-control"
                              rows="3"
                              th:field="*{description}">
                    </textarea>


                </div>







                <div class="row">


                    <div class="col-md-6 mb-3">


                        <label class="form-label">
                            Start Date
                        </label>


                        <input type="date"
                               class="form-control"
                               th:field="*{startDate}">


                    </div>





                    <div class="col-md-6 mb-3">


                        <label class="form-label">
                            End Date
                        </label>


                        <input type="date"
                               class="form-control"
                               th:field="*{endDate}">


                    </div>


                </div>







                <div class="mb-3">


                    <label class="form-label">
                        Status
                    </label>


                    <select class="form-select"
                            th:field="*{status}">


                        <option value="Active">
                            Active
                        </option>


                        <option value="Completed">
                            Completed
                        </option>


                        <option value="On Hold">
                            On Hold
                        </option>


                    </select>


                </div>








                <!-- Department Mapping -->

                <div class="mb-3">


                    <label class="form-label">
                        Department
                    </label>


                    <select class="form-select"
                            th:field="*{department}">


                        <option value="">
                            Select Department
                        </option>


                        <option th:each="dept : ${departments}"
                                th:value="${dept.id}"
                                th:text="${dept.name}">
                        </option>


                    </select>


                </div>








                <button type="submit"
                        class="btn btn-success">

                    Update Project

                </button>



                <a href="/projects"
                   class="btn btn-secondary ms-2">

                    Back

                </a>




            </form>


        </div>


    </div>


</div>


</body>

</html>
