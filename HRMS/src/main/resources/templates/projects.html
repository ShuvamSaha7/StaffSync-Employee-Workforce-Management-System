<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body>


<div class="container mt-4">


    <h2>Project Management</h2>


    <!-- Add Project -->

    <a href="/projects/add"
       class="btn btn-success mb-3">

        Add Project

    </a>



    <!-- Search -->

    <form action="/projects/search"
          method="get">

        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="Search project">

        <button type="submit"
                class="btn btn-primary mt-2">

            Search

        </button>

    </form>



    <!-- Project Table -->

    <table class="table table-bordered table-hover mt-4">


        <thead>

        <tr class="table-dark">

            <th>ID</th>

            <th>Project Name</th>

            <th>Description</th>

            <th>Start Date</th>

            <th>End Date</th>

            <th>Status</th>

            <th>Department</th>

            <th>Total Employees</th>

            <th>Action</th>

        </tr>

        </thead>



        <tbody>


        <tr th:each="project : ${projects}">


            <td th:text="${project.id}"></td>


            <td th:text="${project.projectName}"></td>


            <td th:text="${project.description}"></td>


            <td th:text="${project.startDate}"></td>


            <td th:text="${project.endDate}"></td>


            <td th:text="${project.status}"></td>



            <!-- Department -->

            <td th:text="${project.department != null
                          ? project.department.name
                          : 'Not Assigned'}">
            </td>



            <!-- Total Employees -->

            <td>

                <span class="badge bg-primary"
                      th:text="${project.employees != null
                                ? project.employees.size()
                                : 0}">
                </span>

            </td>



            <!-- Actions -->

            <td>

                <a th:href="@{/projects/edit/{id}(id=${project.id})}"
                   class="btn btn-warning btn-sm">

                    Edit

                </a>


                <a th:href="@{/projects/delete/{id}(id=${project.id})}"
                   class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>


        </tr>


        </tbody>


    </table>


</div>


</body>

</html>
