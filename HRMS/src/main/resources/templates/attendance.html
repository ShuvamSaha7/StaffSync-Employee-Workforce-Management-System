<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Attendance Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">
                Attendance Management
            </h2>

            <p class="text-muted mb-0">
                Manage employee attendance records
            </p>

        </div>

        <a href="/attendance/add"
           class="btn btn-primary">

            + Add Attendance

        </a>

    </div>


    <!-- Attendance Table -->

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover table-bordered align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Employee</th>

                        <th>Date</th>

                        <th>Check In</th>

                        <th>Check Out</th>

                        <th>Status</th>

                        <th>Remarks</th>

                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="attendance : ${attendanceList}">

                        <td th:text="${attendance.id}">
                            1
                        </td>

                        <td th:text="${attendance.employee.name}">
                            Employee
                        </td>

                        <td th:text="${attendance.attendanceDate}">
                            2026-08-16
                        </td>

                        <td th:text="${attendance.checkIn}">
                            09:00
                        </td>

                        <td th:text="${attendance.checkOut}">
                            18:00
                        </td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${attendance.status == 'PRESENT'}">

                                PRESENT

                            </span>

                            <span class="badge bg-danger"
                                  th:if="${attendance.status == 'ABSENT'}">

                                ABSENT

                            </span>

                            <span class="badge bg-warning text-dark"
                                  th:if="${attendance.status == 'HALF DAY'}">

                                HALF DAY

                            </span>

                        </td>

                        <td th:text="${attendance.remarks}">
                            -
                        </td>

                        <td>

                            <a th:href="@{/attendance/edit/{id}(id=${attendance.id})}"
                               class="btn btn-warning btn-sm">

                                Edit

                            </a>

                            <a th:href="@{/attendance/delete/{id}(id=${attendance.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this attendance record?')">

                                Delete

                            </a>

                        </td>

                    </tr>

                    <!-- Empty state -->

                    <tr th:if="${#lists.isEmpty(attendanceList)}">

                        <td colspan="8"
                            class="text-center text-muted py-4">

                            No attendance records found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Back -->

    <div class="mt-3">

        <a href="/dashboard"
           class="btn btn-secondary">

            ← Back to Dashboard

        </a>

    </div>

</div>

</body>

</html>
