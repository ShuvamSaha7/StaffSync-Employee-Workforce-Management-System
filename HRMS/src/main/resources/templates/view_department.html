<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

    <title>View Department</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">


</head>


<body>


<div class="container mt-5">


    <h2 class="mb-4">Department Details</h2>



    <table class="table table-bordered">


        <tr>

            <th>ID</th>

            <td th:text="${department.id}"></td>

        </tr>



        <tr>

            <th>Name</th>

            <td th:text="${department.name}"></td>

        </tr>



        <tr>

            <th>Description</th>

            <td th:text="${department.description}"></td>

        </tr>



        <tr>

            <th>Total Employees</th>

            <td th:text="${department.employees != null ? department.employees.size() : 0}">
            </td>

        </tr>


    </table>




    <!-- Projects Section -->

    <div class="card mt-4">


        <div class="card-header bg-success text-white">

            <h5 class="mb-0">
                Projects Under This Department
            </h5>

        </div>



        <div class="card-body">


            <table class="table table-bordered">


                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Project Name</th>

                    <th>Status</th>

                    <th>Start Date</th>

                    <th>End Date</th>

                </tr>


                </thead>



                <tbody>


                <tr th:each="project : ${department.projects}">


                    <td th:text="${project.id}"></td>


                    <td th:text="${project.projectName}"></td>


                    <td th:text="${project.status}"></td>


                    <td th:text="${project.startDate}"></td>


                    <td th:text="${project.endDate}"></td>


                </tr>


                </tbody>


            </table>



        </div>


    </div>





    <a href="/departments"
       class="btn btn-primary mt-3">

        Back

    </a>



</div>


</body>


</html>
