<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

    <title>Employees</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>



<body>


<div class="container mt-4">


    <h2>Employee Management</h2>




    <a href="/employees/add"
       class="btn btn-success mb-3">

        Add Employee

    </a>





    <form action="/employees/search"
          method="get">


        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="Search employee by name">


        <button class="btn btn-primary mt-2">

            Search

        </button>


    </form>







    <table class="table table-bordered mt-4">


        <tr class="table-dark">


            <th>ID</th>

            <th>Name</th>

            <th>Email</th>

            <th>Phone</th>

            <th>Department</th>

            <th>Project</th>

            <th>Designation</th>

            <th>Salary</th>

            <th>Joining Date</th>

            <th>Action</th>


        </tr>







        <tr th:each="emp : ${employees}">


            <td th:text="${emp.id}"></td>


            <td th:text="${emp.name}"></td>


            <td th:text="${emp.email}"></td>


            <td th:text="${emp.phone}"></td>





            <!-- Department -->

            <td th:text="${emp.department != null ? emp.department.name : 'Not Assigned'}"></td>





            <!-- Project -->

            <td th:text="${emp.project != null ? emp.project.projectName : 'Not Assigned'}"></td>





            <td th:text="${emp.designation}"></td>


            <td th:text="${emp.salary}"></td>


            <td th:text="${emp.joiningDate}"></td>






            <td>


                <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                   class="btn btn-warning btn-sm">

                    Edit

                </a>





                <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                   class="btn btn-danger btn-sm">

                    Delete

                </a>


            </td>



        </tr>



    </table>




</div>



</body>


</html>
