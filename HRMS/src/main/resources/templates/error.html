<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Error</title>
</head>

<body>

<h2>Error Occurred</h2>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<p th:unless="${errorMessage}">
    Something went wrong. Please try again.
</p>

<a href="/dashboard">
    Go Dashboard
</a>

</body>

</html>
