<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Add Leave - StaffSync</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .form-card {
            max-width: 750px;
            margin: 40px auto;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-title {
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
            padding: 10px 12px;
        }

        .btn {
            border-radius: 9px;
            font-weight: 600;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="form-card">


        <!-- Header -->

        <div class="mb-4">

            <h2 class="form-title">
                Add Leave
            </h2>

            <p class="text-muted">
                Create a leave record for an employee.
            </p>

        </div>


        <!-- Form -->

        <form th:action="@{/leaves/save}"
              th:object="${leave}"
              method="post">


            <!-- Employee -->

            <div class="mb-3">

                <label class="form-label">
                    Employee
                </label>

                <select class="form-select"
                        th:field="*{employee}"
                        required>

                    <option value="">
                        Select Employee
                    </option>

                    <option th:each="employee : ${employees}"
                            th:value="${employee.id}"
                            th:text="${employee.name + ' (ID: ' + employee.id + ')'}">

                    </option>

                </select>

                <div class="error"
                     th:if="${#fields.hasErrors('employee')}"
                     th:errors="*{employee}">
                </div>

            </div>


            <!-- Leave Type -->

            <div class="mb-3">

                <label class="form-label">
                    Leave Type
                </label>

                <select class="form-select"
                        th:field="*{leaveType}"
                        required>

                    <option value="">
                        Select Leave Type
                    </option>

                    <option value="Casual Leave">
                        Casual Leave
                    </option>

                    <option value="Sick Leave">
                        Sick Leave
                    </option>

                    <option value="Annual Leave">
                        Annual Leave
                    </option>

                    <option value="Emergency Leave">
                        Emergency Leave
                    </option>

                </select>

                <div class="error"
                     th:if="${#fields.hasErrors('leaveType')}"
                     th:errors="*{leaveType}">
                </div>

            </div>


            <!-- Dates -->

            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Start Date
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{startDate}"
                           required>

                    <div class="error"
                         th:if="${#fields.hasErrors('startDate')}"
                         th:errors="*{startDate}">
                    </div>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        End Date
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{endDate}"
                           required>

                    <div class="error"
                         th:if="${#fields.hasErrors('endDate')}"
                         th:errors="*{endDate}">
                    </div>

                </div>


            </div>


            <!-- Reason -->

            <div class="mb-3">

                <label class="form-label">
                    Reason
                </label>

                <textarea class="form-control"
                          rows="4"
                          th:field="*{reason}"
                          placeholder="Enter reason for leave"
                          required>
                </textarea>

                <div class="error"
                     th:if="${#fields.hasErrors('reason')}"
                     th:errors="*{reason}">
                </div>

            </div>


            <!-- Status -->

            <div class="mb-4">

                <label class="form-label">
                    Status
                </label>

                <select class="form-select"
                        th:field="*{status}"
                        required>

                    <option value="">
                        Select Status
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Approved">
                        Approved
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>

                <div class="error"
                     th:if="${#fields.hasErrors('status')}"
                     th:errors="*{status}">
                </div>

            </div>


            <!-- Buttons -->

            <div class="d-flex gap-2">

                <button type="submit"
                        class="btn btn-primary">

                    Save Leave

                </button>


                <a href="/leaves"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </div>


        </form>


    </div>


</div>


</body>

</html>
