<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

    <title>Departments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>



<body>


<div class="container mt-4">



    <h2 class="mb-4">
        Department Management
    </h2>




    <!-- Add Department -->

    <a href="/departments/add"
       class="btn btn-success mb-3">

        Add Department

    </a>





    <!-- Search Department -->


    <form action="/departments/search"
          method="get"
          class="mb-3">


        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="Search Department">


        <button class="btn btn-primary mt-2">

            Search

        </button>


    </form>






    <!-- Department Table -->


    <table class="table table-bordered table-striped">



        <thead class="table-dark">


        <tr>


            <th>ID</th>

            <th>Department Name</th>

            <th>Description</th>

            <th>Total Employees</th>

            <th>Action</th>


        </tr>


        </thead>





        <tbody>



        <tr th:each="dept : ${departments}">



            <td th:text="${dept.id}"></td>



            <td th:text="${dept.name}"></td>



            <td th:text="${dept.description}"></td>




            <!-- Employee Count -->


            <td th:text="${dept.employees != null ? dept.employees.size() : 0}">

                0

            </td>





            <td>



                <!-- View -->


                <a th:href="@{/departments/view/{id}(id=${dept.id})}"
                   class="btn btn-info btn-sm">


                    View


                </a>





                <!-- Edit -->


                <a th:href="@{/departments/edit/{id}(id=${dept.id})}"
                   class="btn btn-warning btn-sm">


                    Edit


                </a>






                <!-- Delete -->


                <a th:href="@{/departments/delete/{id}(id=${dept.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this department?')">


                    Delete


                </a>



            </td>




        </tr>



        </tbody>



    </table>





    <a href="/dashboard"
       class="btn btn-secondary">


        Back to Dashboard


    </a>




</div>



</body>


</html>
